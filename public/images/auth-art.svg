<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="50%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="auroraIndigo" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraCyan" cx="65%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraViolet" cx="50%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Prism Crystal Facet Gradients -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="600" height="800" fill="url(#bgGrad)" />

  <!-- Aurora Lights -->
  <circle cx="280" cy="380" r="320" fill="url(#auroraIndigo)" />
  <circle cx="360" cy="320" r="280" fill="url(#auroraCyan)" />
  <circle cx="300" cy="520" r="260" fill="url(#auroraViolet)" />

  <!-- High-Tech Coordinate Grid -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="0.75">
    <line x1="50" y1="0" x2="50" y2="800" />
    <line x1="150" y1="0" x2="150" y2="800" />
    <line x1="250" y1="0" x2="250" y2="800" />
    <line x1="350" y1="0" x2="350" y2="800" />
    <line x1="450" y1="0" x2="450" y2="800" />
    <line x1="550" y1="0" x2="550" y2="800" />

    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
  </g>

  <!-- Concentric Orbital Arcs -->
  <circle cx="300" cy="380" r="190" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8" opacity="0.3" />
  <circle cx="300" cy="380" r="240" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 12" opacity="0.25" />
  <circle cx="300" cy="380" r="280" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="1 10" opacity="0.2" />

  <!-- Vertical Laser Data Streams -->
  <line x1="210" y1="120" x2="210" y2="640" stroke="url(#lineBeam)" stroke-width="1.5" opacity="0.6" />
  <line x1="390" y1="160" x2="390" y2="680" stroke="url(#lineBeam)" stroke-width="1.5" opacity="0.6" />

  <!-- 3D Crystalline Prism Monolith -->
  <g filter="url(#glow)">
    <polygon points="300,190 380,240 300,280 220,240" fill="url(#facetTop)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />
    <polygon points="220,240 300,280 300,560 220,500" fill="url(#facet1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <polygon points="300,280 380,240 380,500 300,560" fill="url(#facet2)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <polygon points="220,500 300,560 380,500 300,590" fill="url(#facet3)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="300" y1="280" x2="300" y2="560" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
  </g>

  <!-- Floating Holographic Orbital Nodes -->
  <circle cx="220" cy="240" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="380" cy="240" r="4" fill="#818cf8" filter="url(#glow)" />
  <circle cx="300" cy="190" r="5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="300" cy="280" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="300" cy="560" r="5" fill="#c084fc" filter="url(#glow)" />
</svg>
